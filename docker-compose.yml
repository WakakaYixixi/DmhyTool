services:
  dmhytool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmhytool
    ports:
      - "6199:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
