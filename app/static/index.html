<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DMHY Tool</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">DMHY Tool OK</p>
        <h1>动漫花园资源搜索</h1>
        <p class="subtitle">搜索、勾选并导出磁力链接</p>
      </header>

      <section class="panel" aria-labelledby="search-heading">
        <h2 id="search-heading">搜索</h2>
        <form id="search-form" class="search-form">
          <label class="sr-only" for="search-input">搜索关键词</label>
          <input id="search-input" name="q" type="search" maxlength="100"
                 placeholder="输入动画名称、字幕组等关键词" autocomplete="off" required>
          <button id="search-button" type="submit">搜索</button>
          <button id="save-button" type="button" class="secondary">保存当前搜索词</button>
        </form>
        <p id="search-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="saved-heading">
        <div class="section-title">
          <h2 id="saved-heading">已保存搜索词</h2>
          <span class="hint">点击搜索，右侧按钮删除</span>
        </div>
        <div id="saved-terms" class="saved-terms"></div>
      </section>

      <section id="results-section" class="panel hidden" aria-labelledby="results-heading">
        <div class="section-title results-title">
          <h2 id="results-heading">搜索结果 <span id="result-count"></span></h2>
          <div class="actions">
            <button id="select-all" type="button" class="secondary small">全选</button>
            <button id="select-none" type="button" class="secondary small">全不选</button>
            <button id="export-button" type="button" class="small">测试导出磁力链接</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="check-column">选择</th>
                <th>发布时间</th>
                <th>标题</th>
                <th>字幕组</th>
                <th>大小</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>

      <section id="export-section" class="panel hidden" aria-labelledby="export-heading">
        <div class="section-title">
          <h2 id="export-heading">磁力链接</h2>
          <button id="copy-button" type="button" class="secondary small">复制全部</button>
        </div>
        <p id="export-status" class="status" role="status" aria-live="polite"></p>
        <textarea id="magnet-output" rows="8" readonly
                  placeholder="导出的 magnet 链接会显示在这里"></textarea>
        <div id="export-failures" class="failures"></div>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
